# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Gitlab - Values Tests
templates:
  - templates/gitlab/values.yaml
tests:
  - it: rejects an object storage endpoint without an HTTP URI scheme
    set:
      addons.gitlab.enabled: true
      addons.gitlab.objectStorage.endpoint: garage.garage.svc.cluster.local:3900
    asserts:
      - failedTemplate:
          errorMessage: "addons.gitlab.objectStorage.endpoint must begin with http:// or https:// when set"

  - it: rejects a registry object storage endpoint without an HTTP URI scheme
    set:
      addons.gitlab.enabled: true
      addons.gitlab.objectStorage.endpoint: http://garage.garage.svc.cluster.local:3900
      addons.gitlab.objectStorage.regionendpoint: garage.garage.svc.cluster.local:3900
    asserts:
      - failedTemplate:
          errorMessage: "addons.gitlab.objectStorage.regionendpoint must begin with http:// or https:// when set"

  - it: does not validate dormant object storage values when GitLab is disabled
    set:
      addons.gitlab.enabled: false
      addons.gitlab.objectStorage.endpoint: garage.garage.svc.cluster.local:3900
    asserts:
      - hasDocuments:
          count: 0

  - it: sets the registry host from addons.gitlab.hostnames.registry
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.hostnames.gitlab: custom-gitlab
      addons.gitlab.hostnames.registry: custom-registry
      domain: example.com
    asserts:
      - equal:
          path: routes.inbound.gitlab.hosts[0]
          value: "custom-gitlab.example.com"
      - equal:
          path: routes.inbound.registry.hosts[0]
          value: "custom-registry.example.com"
      - equal:
          path: global.hosts.domain
          value: "example.com"
      - equal:
          path: global.hosts.gitlab.name
          value: "custom-gitlab.example.com"
      - equal:
          path: global.hosts.registry.name
          value: "custom-registry.example.com"

  - it: configures the Big Bang Redis secret with the shared auth values shape
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.redis.password: test-password
    asserts:
      - equal:
          path: global.redis.auth.enabled
          value: true
      - equal:
          path: global.redis.auth.secret
          value: "gitlab-redis-secret-bb"
      - equal:
          path: global.redis.auth.key
          value: "secret"
      - notExists:
          path: global.redis.password

  - it: preserves per-bucket object storage connections by default
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.objectStorage.type: minio
      addons.gitlab.objectStorage.endpoint: http://garage.garage.svc.cluster.local:3900
      addons.gitlab.objectStorage.region: garage
      addons.gitlab.objectStorage.accessKey: test-access-key
      addons.gitlab.objectStorage.accessSecret: test-secret-key
    asserts:
      - notExists:
          path: global.appConfig.object_store
      - equal:
          path: global.appConfig.lfs.connection.secret
          value: gitlab-object-storage
      - equal:
          path: global.appConfig.artifacts.connection.key
          value: rails
      - equal:
          path: networkPolicies.egress.definitions.storage-subnets.ports
          value:
            - port: 443
              protocol: TCP

  - it: uses consolidated object storage only when explicitly enabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.objectStorage.type: s3
      addons.gitlab.objectStorage.endpoint: https://s3.us-gov-west-1.amazonaws.com
      addons.gitlab.objectStorage.region: us-gov-west-1
      addons.gitlab.objectStorage.accessKey: test-access-key
      addons.gitlab.objectStorage.accessSecret: test-secret-key
      addons.gitlab.values.global.appConfig.object_store.enabled: true
    asserts:
      - equal:
          path: global.appConfig.object_store.enabled
          value: true
      - equal:
          path: global.appConfig.object_store.connection.secret
          value: gitlab-object-storage
      - equal:
          path: global.appConfig.object_store.connection.key
          value: rails
      - notExists:
          path: global.appConfig.lfs.connection
      - notExists:
          path: global.appConfig.artifacts.connection
      - notExists:
          path: global.appConfig.uploads.connection
      - notExists:
          path: global.appConfig.packages.connection
      - notExists:
          path: global.appConfig.dependencyProxy.connection

  - it: enables external subnet egress for Big Bang GitLab 19 connection values
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.database.host: postgresql-rw.postgresql.svc.cluster.local
      addons.gitlab.objectStorage.type: minio
      addons.gitlab.objectStorage.endpoint: http://garage.garage.svc.cluster.local:3900
      addons.gitlab.objectStorage.region: garage
    asserts:
      - equal:
          path: networkPolicies.egress.from.migrations.to.definition.storage-subnets
          value: true
      - equal:
          path: networkPolicies.egress.from.migrations.to.definition.database-subnets
          value: true
      - equal:
          path: networkPolicies.egress.from.gitlab-exporter.to.definition.database-subnets
          value: true

  - it: enables external subnet egress for direct upstream GitLab 19 values
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.values.global.psql.host: postgres.example.internal
      addons.gitlab.values.global.redis.host: redis.example.internal
      addons.gitlab.values.global.appConfig.object_store.enabled: true
    asserts:
      - equal:
          path: networkPolicies.egress.from.migrations.to.definition.storage-subnets
          value: true
      - equal:
          path: networkPolicies.egress.from.migrations.to.definition.database-subnets
          value: true
      - equal:
          path: networkPolicies.egress.from.webservice.to.definition.redis-subnets
          value: true
      - equal:
          path: networkPolicies.egress.from.sidekiq.to.definition.redis-subnets
          value: true
      - equal:
          path: networkPolicies.egress.from.migrations.to.definition.redis-subnets
          value: true
      - equal:
          path: networkPolicies.egress.from.toolbox.to.definition.redis-subnets
          value: true
      - equal:
          path: networkPolicies.egress.from.gitlab-exporter.to.definition.redis-subnets
          value: true

  - it: enables external storage subnet egress for direct per-feature object storage values
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.values.global.appConfig.artifacts.connection:
        secret: gitlab-object-storage
        key: rails
    asserts:
      - equal:
          path: networkPolicies.egress.from.migrations.to.definition.storage-subnets
          value: true

  - it: enables external Redis subnet egress for upstream Sentinel values
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.values.global.redis.host: redis-sentinel.example.internal
      addons.gitlab.values.global.redis.sentinels:
        - host: sentinel.example.internal
          port: 26379
    asserts:
      - equal:
          path: networkPolicies.egress.from.webservice.to.definition.redis-subnets
          value: true
      - exists:
          path: networkPolicies.egress.definitions.redis-subnets

  - it: enables external Redis subnet egress for an upstream redis.yml override
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.values.global.redis.redisYmlOverride:
        cache:
          secret: gitlab-redis-yml
          key: redis.yml
    asserts:
      - equal:
          path: networkPolicies.egress.from.webservice.to.definition.redis-subnets
          value: true

  - it: enables external Redis subnet egress when password authentication is disabled
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.values.global.redis.host: redis.example.internal
      addons.gitlab.values.global.redis.auth.enabled: false
    asserts:
      - equal:
          path: networkPolicies.egress.from.webservice.to.definition.redis-subnets
          value: true
      - exists:
          path: networkPolicies.egress.definitions.redis-subnets

  - it: should account for external Redis in routes and disable internal Redis metrics ingress
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.values.global.redis.host: redis.example.internal
      addons.gitlab.values.global.redis.port: 6380
    asserts:
      - equal:
          path: routes.outbound["external-redis"].enabled
          value: true
      - equal:
          path: routes.outbound["external-redis"].hosts[0]
          value: redis.example.internal
      - equal:
          path: routes.outbound["external-redis"].ports[0].number
          value: 6380
      - equal:
          path: networkPolicies.ingress.to["redis:9121"].from.k8s["monitoring-monitoring-kube-prometheus@monitoring/prometheus"]
          value: false

  - it: tolerates null GitLab 19 removed service blocks without enabling replacements
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons:
        gitlab:
          enabled: true
          values:
            global:
              minio: null
            upstream:
              postgresql: null
              redis: null
              minio: null
    asserts:
      - equal:
          path: networkPolicies.egress.from.migrations.to.definition.storage-subnets
          value: true
      - equal:
          path: networkPolicies.egress.from.migrations.to.definition.database-subnets
          value: true
      - notExists:
          path: redis-bb
      - notExists:
          path: garage
      - notExists:
          path: postgresql.enabled

  - it: pins every CNG image to the CVE-2026-110264 patched release while the package ships GitLab 19.4.2
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.sso.enabled: true
      sso.secretName: sso-ca
    asserts:
      - equal:
          path: global.certificates.image.tag
          value: v19.5.1-ubi
      - contains:
          path: global.certificates.customCAs
          content:
            secret: ca-certs-dod-trust-anchors-self-signed
      - equal:
          path: global.kubectl.image.tag
          value: v19.5.1-ubi
      - equal:
          path: global.gitlabBase.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.shared-secrets.selfsign.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.webservice.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.webservice.workhorse.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.sidekiq.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.toolbox.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.migrations.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.gitaly.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.gitaly.cgroups.initContainer.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.geo-logcursor.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.mailroom.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.gitlab-pages.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.kas.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.praefect.image.tag
          value: v19.5.1-ubi

  - it: applies the patched CNG image tags to a vulnerable helmRepo package pin
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.sourceType: helmRepo
      addons.gitlab.helmRepo.tag: 10.3.2-bb.1
      addons.gitlab.git.tag: 10.5.1-bb.0
    asserts:
      - equal:
          path: upstream.gitlab.webservice.image.tag
          value: v19.5.1-ubi
      - equal:
          path: upstream.gitlab.sidekiq.image.tag
          value: v19.5.1-ubi

  - it: stops overriding CNG image tags once the package pin ships a patched GitLab
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.git.tag: 10.5.1-bb.0
    asserts:
      - notExists:
          path: global.gitlabBase
      - notExists:
          path: upstream.gitlab.webservice.image
      - notExists:
          path: upstream.gitlab.webservice.workhorse.tag
      - notExists:
          path: upstream.gitlab.gitaly.image

  - it: does not override CNG image tags for a non-semver package ref
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.git.tag: null
      addons.gitlab.git.branch: main
    asserts:
      - notExists:
          path: global.gitlabBase
      - notExists:
          path: upstream.gitlab.webservice.image

  - it: does not override CNG image tags when a git commit selects the package instead of the default tag
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.git.tag: null
      addons.gitlab.git.branch: maintenance
      addons.gitlab.git.commit: 0123456789abcdef0123456789abcdef01234567
    asserts:
      - notExists:
          path: global.gitlabBase
      - notExists:
          path: upstream.gitlab.webservice.image

  - it: does not override CNG image tags when a git semver range selects the package instead of the default tag
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.git.semver: ">= 10.0.0"
    asserts:
      - notExists:
          path: global.gitlabBase
      - notExists:
          path: upstream.gitlab.webservice.image

  - it: does not override CNG image tags for the GitLab 18.11 migration package pin
    postRenderer:
      cmd: "sh"
      args:
        - "-c"
        - "yq eval '.stringData.defaults' - | yq eval '.'"
    set:
      addons.gitlab.enabled: true
      addons.gitlab.git.tag: 9.11.7-bb.0
    asserts:
      - notExists:
          path: global.gitlabBase
      - notExists:
          path: upstream.gitlab.webservice.image
      - notExists:
          path: upstream.gitlab.sidekiq.image
