# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Package - Grafana - Env Secret Tests
templates:
  - templates/grafana/grafana-env-secret.yaml
tests:
  - it: should not create the GitLab Redis password secret by default
    set:
      addons.gitlab.enabled: true
      addons.gitlab.redis.password: test-password
    asserts:
      - hasDocuments:
          count: 0
  - it: should create the GitLab Redis password secret when Redis datasources are enabled
    set:
      grafana.redisDatasources.enabled: true
      addons.gitlab.enabled: true
      addons.gitlab.redis.password: test-password
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: grafana-env-secret
      - equal:
          path: stringData.GITLAB_REDIS_PASSWORD
          value: test-password
